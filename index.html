<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yume⁺ — Where AI Creators Are Born</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating Pill Navigation Bar (Exact Reference Specs) -->
    <header class="floating-header-wrap">
        <nav class="yume-navbar">
            <!-- Brand Logo -->
            <a class="yume-brand" href="#/home">
                <span class="yume-brand-text">Yume<sup class="yume-brand-plus">⁺</sup></span>
            </a>

            <!-- Centered Nav Links -->
            <div class="yume-nav-links">
                <a href="#/home" class="yume-nav-link active" data-nav-target="home">Gallery</a>
                <a href="#/search" class="yume-nav-link" data-nav-target="search">Explore</a>
                <a href="#/profile" class="yume-nav-link" data-nav-target="profile">Creators</a>
                <a href="#/pricing" class="yume-nav-link" data-nav-target="pricing">Pricing</a>
                <a href="#/about" class="yume-nav-link" data-nav-target="about">About</a>
            </div>

            <!-- Right Actions -->
            <div class="yume-nav-actions">
                <button type="button" class="yume-login-link" data-nav-login>Log in</button>
                <button type="button" class="yume-start-creating-btn" data-nav-create>✦ Start Creating ✦</button>
            </div>
        </nav>
    </header>

    <!-- Main Content Root -->
    <main class="main-container" id="appRoot">
        <!-- Dynamic pages rendered by script.js -->
    </main>

    <!-- Fixed Bottom Navigation (Mobile Only) -->
    <nav class="bottom-navbar">
        <button class="bottom-nav-btn active" data-nav="home" aria-label="Home">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9.5 12 3l9 6.5" />
                <path d="M5 10v11h14V10" />
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="search" aria-label="Explore">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="create" aria-label="Create">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14" />
                <path d="M5 12h14" />
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="activity" aria-label="Activity">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="profile" aria-label="Profile">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
