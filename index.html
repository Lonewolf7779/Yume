<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yume - Visual Discovery Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <!-- Logo -->
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" width="32" height="32">
                    <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="20" cy="20" r="6" fill="currentColor"/>
                    <path d="M20 14 L20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M26 20 L32 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20 26 L20 32" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M14 20 L8 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">Yume</span>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input type="text" class="search-input" placeholder="Search ideas...">
            </div>

            <!-- Navigation Links -->
            <div class="nav-icons">
                <!-- Create Button -->
                <button class="nav-icon-btn create-btn" aria-label="Create">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </button>
                
                <!-- Notifications Button -->
                <button class="nav-icon-btn notifications-btn" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                
                <!-- Profile Button -->
                <button class="nav-icon-btn profile-btn" aria-label="Profile">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <circle cx="12" cy="8" r="4" fill="currentColor"/>
                        <path d="M12 14c-4 0-6 2-6 4v4h12v-4c0-2-2-4-6-4z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container" id="appRoot">
        <!-- Pages will be generated by JavaScript -->
    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="bottom-navbar">
                <button class="bottom-nav-btn active" data-nav="home" aria-label="Home">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9.5 12 3l9 6.5" />
                <path d="M5 10v11h14V10" />
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="search" aria-label="Search">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="create" aria-label="Create">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14" />
                <path d="M5 12h14" />
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="activity" aria-label="Activity">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
        </button>
        <button class="bottom-nav-btn" data-nav="profile" aria-label="Profile">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
